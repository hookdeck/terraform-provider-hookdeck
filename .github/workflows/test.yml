# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
on:
  pull_request:
    paths-ignore:
      - "README.md"
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: false
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5.0

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: hashicorp/setup-terraform@v4
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: false
      - run: go generate ./...
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."; exit 1)

  # Run acceptance tests in a matrix with Terraform CLI versions
  test:
    name: Terraform Provider Acceptance Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip when the PR is from a fork or from Dependabot — neither has access
    # to HOOKDECK_API_KEY (forks by GitHub policy; Dependabot by its restricted
    # token scope). The acceptance tests run again after merge to main.
    if: |
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # Acceptance tests create real Hookdeck resources. The API has a
    # 240 req/min limit and the provider doesn't retry on 429. Serialize all
    # acceptance runs across the repo to keep within the limit.
    concurrency:
      group: acceptance-tests
      cancel-in-progress: false
    strategy:
      fail-fast: false
      # Same reasoning: serialize matrix entries too so two TF versions don't
      # race on the rate limit within a single workflow run.
      max-parallel: 1
      matrix:
        terraform:
          - "1.9.*"
          - "1.10.*"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"
          cache: false
      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      - env:
          TF_ACC: "1"
          HOOKDECK_API_KEY: ${{ secrets.HOOKDECK_API_KEY }}
        run: go test -v -cover -timeout 25m ./internal/provider/...
        timeout-minutes: 25
