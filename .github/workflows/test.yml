# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
on:
  pull_request:
    paths-ignore:
      - "README.md"
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: false
      - run: go mod download
      - run: go build -v .
      # Acceptance tests skip themselves without TF_ACC, so this runs the
      # unit tests of every package and needs no credentials.
      - name: Run unit tests
        run: go test ./...
      - name: Run linters
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5.0

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: hashicorp/setup-terraform@v4
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: false
      - run: go generate ./...
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."; exit 1)

  # Run acceptance tests in a matrix with Terraform CLI versions
  test:
    name: Terraform Provider Acceptance Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip when the PR is from a fork or from Dependabot — neither has access
    # to HOOKDECK_ORG_API_KEY (forks by GitHub policy; Dependabot by its
    # restricted token scope). The acceptance tests run again after merge to
    # main.
    if: |
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      matrix:
        terraform:
          - "1.16.*"
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"
          cache: false
      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      - env:
          TF_ACC: "1"
          HOOKDECK_ORG_API_KEY: ${{ secrets.HOOKDECK_ORG_API_KEY }}
        run: go test -v -cover -timeout 25m ./internal/provider/...
        timeout-minutes: 25
      # Failed or interrupted tests leave resources behind. Everything the
      # tests create is named tf-acc-*; this deletes what is over an hour old,
      # so a run in progress elsewhere is not disturbed.
      - name: Tear down leftover test resources
        if: always()
        env:
          HOOKDECK_ORG_API_KEY: ${{ secrets.HOOKDECK_ORG_API_KEY }}
        run: go run ./cmd/teardown --auto-approve
